<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-label="Ilustração de uma dentista sorridente acenando ao lado de um dente feliz">
  <defs>
    <clipPath id="faceClip">
      <ellipse cx="130" cy="104" rx="44" ry="47"/>
    </clipPath>
    <clipPath id="haloClip">
      <circle cx="130" cy="130" r="118"/>
    </clipPath>
  </defs>

  <!-- Halo de fundo -->
  <circle cx="130" cy="130" r="118" fill="#E0F2FE"/>
  <circle cx="130" cy="130" r="97" fill="#F0F9FF"/>

  <g clip-path="url(#haloClip)">
    <!-- Cabelo: massa unica que desce pelos lados ate os ombros -->
    <path d="M130 46c30 0 54 24 54 56 0 20 3 40 8 60 2 8-4 12-12 10-14-4-22-16-24-32-2-16-2-30-2-38h-48c0 8 0 22-2 38-2 16-10 28-24 32-8 2-14-2-12-10 5-20 8-40 8-60 0-32 24-56 54-56Z" fill="#5B4636"/>

    <!-- Pescoco -->
    <path d="M113 140h34v28a17 17 0 0 1-34 0Z" fill="#F0B78E"/>

    <!-- Corpo / jaleco -->
    <path d="M130 164c28 0 47 9 56 24 7 12 9 28 9 46v40H65v-40c0-18 2-34 9-46 9-15 28-24 56-24Z" fill="#FFFFFF" stroke="#D8E3EC" stroke-width="3"/>
    <!-- Blusa por baixo -->
    <path d="M112 166h36l-18 30Z" fill="#38BDF8"/>
    <!-- Lapelas -->
    <path d="M112 166l18 30-15 78H98l6-74Z" fill="#F8FAFC" stroke="#D8E3EC" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M148 166l-18 30 15 78h17l-6-74Z" fill="#F8FAFC" stroke="#D8E3EC" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Cracha -->
    <rect x="150" y="212" width="24" height="17" rx="4" fill="#0284C7"/>
    <circle cx="162" cy="220.5" r="3.6" fill="#E0F2FE"/>

    <!-- Braco direito segurando a escova (atras do corpo) -->
    <path d="M176 186c14 6 22 16 24 27" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" fill="none"/>
    <path d="M176 186c14 6 22 16 24 27" stroke="#D8E3EC" stroke-width="19" stroke-linecap="round" fill="none" opacity="0.3"/>

    <!-- Braco esquerdo acenando -->
    <path d="M84 186c-14 6-22 16-24 27" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" fill="none"/>
    <path d="M84 186c-14 6-22 16-24 27" stroke="#D8E3EC" stroke-width="19" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>

  <!-- Rosto -->
  <ellipse cx="130" cy="104" rx="44" ry="47" fill="#F8D3B8"/>
  <!-- Franja -->
  <g clip-path="url(#faceClip)">
    <path d="M84 90c3-32 24-48 46-48s43 16 46 48c-9-19-25-26-38-18-15 9-38 8-54 18Z" fill="#5B4636"/>
  </g>
  <!-- Orelhas -->
  <ellipse cx="86" cy="110" rx="7" ry="10" fill="#F0B78E"/>
  <ellipse cx="174" cy="110" rx="7" ry="10" fill="#F0B78E"/>

  <!-- Sobrancelhas -->
  <path d="M105 88q10-7 20-1" stroke="#5B4636" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M135 87q10-6 20 1" stroke="#5B4636" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Olhos -->
  <circle cx="114" cy="106" r="6.5" fill="#3A2E26"/>
  <circle cx="146" cy="106" r="6.5" fill="#3A2E26"/>
  <circle cx="116.4" cy="103.6" r="2.2" fill="#FFFFFF"/>
  <circle cx="148.4" cy="103.6" r="2.2" fill="#FFFFFF"/>
  <!-- Bochechas -->
  <ellipse cx="101" cy="124" rx="9" ry="6" fill="#F9A8B4" opacity="0.55"/>
  <ellipse cx="159" cy="124" rx="9" ry="6" fill="#F9A8B4" opacity="0.55"/>
  <!-- Sorriso -->
  <path d="M115 126q15 15 30 0" stroke="#B4553F" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Mao direita + escova de dentes -->
  <g transform="rotate(20 202 214)">
    <rect x="195" y="160" width="14" height="56" rx="7" fill="#0EA5E9"/>
    <rect x="192" y="144" width="20" height="22" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="196" y="137" width="12" height="9" rx="4" fill="#7DD3FC"/>
  </g>
  <circle cx="202" cy="214" r="11.5" fill="#F8D3B8"/>

  <!-- Mao esquerda acenando (formato de luva, com dedos arredondados) -->
  <path d="M49 216c-1-9 1-16 4-16s4 5 4 9c0-6 1-13 4-13s4 6 4 12c1-6 2-11 5-11s4 5 3 12c1-4 3-7 5-6s2 5 1 9c-1 8-6 14-14 14s-15-4-16-10Z" fill="#F8D3B8"/>

  <!-- Dente mascote sorrindo -->
  <g transform="translate(24 148)">
    <path d="M21 2c9 0 15 5 15 13 0 8-3 11-4 20-1 8-3 13-6 13-3 0-3-7-5-7s-2 7-5 7c-3 0-5-5-6-13-1-9-4-12-4-20C6 7 12 2 21 2Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="15.5" cy="17" r="2.5" fill="#3A2E26"/>
    <circle cx="26.5" cy="17" r="2.5" fill="#3A2E26"/>
    <path d="M16.5 24q4.5 4.5 9 0" stroke="#3A2E26" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Brilhos decorativos -->
  <path d="M214 66l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#FBBF24"/>
  <path d="M44 78l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#7DD3FC"/>
  <circle cx="228" cy="140" r="5" fill="#7DD3FC" opacity="0.7"/>
  <circle cx="32" cy="120" r="4" fill="#FBBF24" opacity="0.7"/>
</svg>
